# Сборка iOS-приложения без Mac.
# Codemagic поднимает настоящий Mac в облаке, собирает и подписывает.
#
# Что нужно настроить в интерфейсе Codemagic перед первым запуском:
#   1. Подключить этот репозиторий
#   2. Team Settings → Code signing identities → загрузить сертификат Apple
#   3. Переменные окружения: APP_STORE_CONNECT_* (Codemagic подскажет)
#
# Актуальную версию Xcode проверяй перед сборкой: Apple периодически
# поднимает минимальную версию SDK и отклоняет сборки на старой.

workflows:
  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.example.sortandbuild"   # заменить на свой
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Установить зависимости
        script: npm ci

      - name: Собрать веб-часть
        script: npm run build

      - name: Создать нативный проект iOS
        script: |
          npx cap add ios || true
          npx cap sync ios

      - name: Поставить поды
        script: |
          cd ios/App
          pod install

      - name: Настроить подпись
        script: |
          xcode-project use-profiles

      - name: Собрать ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      # Раскомментировать, когда приложение заведено в App Store Connect
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      email:
        recipients:
          - your@email.com          # заменить на свой
        notify:
          success: true
          failure: true

  android-release:
    name: Android release
    instance_type: linux_x2
    environment:
      node: 20
    scripts:
      - name: Установить зависимости
        script: npm ci
      - name: Собрать веб-часть
        script: npm run build
      - name: Создать нативный проект Android
        script: |
          npx cap add android || true
          npx cap sync android
      - name: Собрать apk
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
