# Сборка iOS и Android без Mac.
# Codemagic поднимает настоящий Mac в облаке, собирает и подписывает.
#
# Этот конфиг рассчитан на ПЛОСКУЮ структуру репозитория:
# package.json, src/, index.html лежат прямо в корне, рядом
# с этим файлом. Никаких переходов в подпапки не требуется.
#
# Версии подобраны по требованиям свежего Capacitor:
#   Node 20 → "The Capacitor CLI requires NodeJS >=22.0.0"
#   Java 17 → "invalid source release: 21" при компиляции

workflows:
  # ---------------------------------------------------------------
  # ANDROID — начни с него: проще, быстрее, не требует сертификатов
  # Apple. Хороший способ убедиться, что сборка вообще работает.
  #
  # instance_type не указан специально: linux_x2 требует платного
  # тарифа, без указания Codemagic берёт доступный на бесплатном.
  # ---------------------------------------------------------------
  android-debug:
    name: Android (отладочная сборка)
    max_build_duration: 45
    environment:
      node: 22
      java: 21
    scripts:
      - name: Установить зависимости
        script: npm install

      - name: Собрать веб-часть
        script: npm run build

      - name: Подготовить нативный проект Android
        script: |
          npx cap add android || echo "платформа уже добавлена, пропускаем"
          npx cap sync android

      - name: Собрать apk
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - hardworkpaysoff0@protonmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------
  # iOS — требует аккаунт Apple Developer ($99/год) и настроенную
  # подпись в Codemagic. Запускай после того, как Android собрался.
  # ---------------------------------------------------------------
  ios-release:
    name: iOS (сборка для TestFlight)
    # instance_type не указываем: любой явный Mac-инстанс требует
    # платного тарифа. Без указания Codemagic сам подберёт машину,
    # доступную на текущем плане.
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.example.sortandbuild"   # ← заменить на свой
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Установить зависимости
        script: npm install

      - name: Собрать веб-часть
        script: npm run build

      - name: Подготовить нативный проект iOS
        script: |
          npx cap add ios || echo "платформа уже добавлена, пропускаем"
          npx cap sync ios

      - name: Поставить поды
        script: |
          cd ios/App
          pod install

      - name: Настроить подпись
        script: xcode-project use-profiles

      - name: Собрать ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Раскомментировать, когда приложение заведено в App Store Connect
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      email:
        recipients:
          - hardworkpaysoff0@protonmail.com
        notify:
          success: true
          failure: true
