# Сборка iOS и Android без Mac.
# Codemagic поднимает настоящий Mac в облаке, собирает и подписывает.
#
# ВАЖНО: код лежит во вложенной папке proj, а этот файл — в корне
# репозитория. Поэтому все команды начинаются с перехода в proj.
#
# Перед первым запуском в интерфейсе Codemagic:
#   1. Подключить этот репозиторий
#   2. Teams → Code signing identities → загрузить сертификат Apple
#      (или включить автоматическое управление подписью)
#   3. Заменить BUNDLE_ID ниже на свой идентификатор
#   4. Указать свою почту в разделе publishing
#
# Актуальную версию Xcode проверяй перед сборкой: Apple периодически
# поднимает минимальную версию SDK и отклоняет сборки на старой.

workflows:
  # ---------------------------------------------------------------
  # ANDROID — начни с него: он проще, быстрее и не требует
  # сертификатов Apple. Хороший способ убедиться, что сборка вообще
  # работает, до возни с подписью iOS.
  #
  # instance_type здесь не указан специально: linux_x2 требует
  # платного тарифа, а без указания Codemagic сам берёт инстанс,
  # доступный на бесплатном плане.
  # ---------------------------------------------------------------
  android-debug:
    name: Android (отладочная сборка)
    max_build_duration: 45
    environment:
      # Версии подобраны по требованиям свежего Capacitor:
      #   Node 20 → "The Capacitor CLI requires NodeJS >=22.0.0"
      #   Java 17 → "invalid source release: 21" при компиляции
      node: 22
      java: 21
    scripts:
      - name: Установить зависимости
        script: |
          cd proj
          npm install

      - name: Собрать веб-часть
        script: |
          cd proj
          npm run build

      - name: Подготовить нативный проект Android
        script: |
          cd proj
          npx cap add android || echo "платформа уже добавлена, пропускаем"
          npx cap sync android

      - name: Собрать apk
        script: |
          cd proj/android
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - proj/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - hardworkpaysoff0@protonmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------
  # iOS — требует аккаунт Apple Developer ($99/год) и настроенную
  # подпись в Codemagic. Запускай после того, как Android собрался.
  #
  # mac_mini_m2 — минимальный доступный Mac-инстанс, на бесплатном
  # тарифе даётся ограниченное количество минут сборки под macOS.
  # Если и он окажется недоступен — проверь в интерфейсе Codemagic
  # раздел Billing → там видно, какие инстансы включены в план.
  # ---------------------------------------------------------------
  ios-release:
    name: iOS (сборка для TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.example.sortandbuild"   # ← заменить на свой
        XCODE_WORKSPACE: "proj/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Установить зависимости
        script: |
          cd proj
          npm install

      - name: Собрать веб-часть
        script: |
          cd proj
          npm run build

      - name: Подготовить нативный проект iOS
        script: |
          cd proj
          npx cap add ios || echo "платформа уже добавлена, пропускаем"
          npx cap sync ios

      - name: Поставить поды
        script: |
          cd proj/ios/App
          pod install

      - name: Настроить подпись
        script: |
          xcode-project use-profiles

      - name: Собрать ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Раскомментировать, когда приложение заведено в App Store Connect
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      email:
        recipients:
          - hardworkpaysoff0@protonmail.com
        notify:
          success: true
          failure: true
